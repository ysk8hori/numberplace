name: Pre Workflow
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          always-auth: true
          node-version: 24.22.3

      - uses: pnpm/action-setup@v4.4.0

      - name: Install Dependencies
        run: pnpm install --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: node_modules をキャッシュ
        uses: actions/cache/save@v5.1.0
        with:
          path: 'node_modules'
          key: node-${{ github.sha }}

  type-check-and-test:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          always-auth: true
          node-version: 24.22.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@v4.4.0

      - name: Restore Dependencies
        uses: actions/cache/restore@v5.1.0
        with:
          path: 'node_modules'
          key: node-${{ github.sha }}

      - name: Type Check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test:run

  delta-typescript-graph:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          always-auth: true
          node-version: 24.22.3

      - uses: pnpm/action-setup@v4.4.0

      - name: Restore Dependencies
        uses: actions/cache/restore@v5.1.0
        with:
          path: 'node_modules'
          key: node-${{ github.sha }}

      - name: run delta-typescript-graph
        uses: ysk8hori/delta-typescript-graph-action@v1.3.0

  storybook-tests:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          always-auth: true
          node-version: 24.22.3

      - uses: pnpm/action-setup@v4.4.0

      - name: Restore Dependencies
        uses: actions/cache/restore@v5.1.0
        with:
          path: 'node_modules'
          key: node-${{ github.sha }}

      - name: install playwright
        run: pnpm exec playwright install

      - name: Run Storybook tests
        run: pnpm run storybook:test:ci

  build:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          always-auth: true
          node-version: 24.22.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@v4.4.0

      - name: Restore Dependencies
        uses: actions/cache/restore@v5.1.0
        with:
          path: 'node_modules'
          key: node-${{ github.sha }}

      - name: build
        run: pnpm run build
